name: Verificação Maximum CNPJ
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.55.1 supports Ubuntu 24.04; ubuntu-latest may select 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mongo2:
        image: mongo:7.0
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mongo3:
        image: mongo:7.0
        ports: ['27019:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ORT_DISABLE_TELEMETRY: '1'
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_TEST_URI_2: mongodb://127.0.0.1:27018
      MONGODB_TEST_URI_3: mongodb://127.0.0.1:27019
      MONGODB_DB: maximum_e2e
      WORKSPACE_ID: ci
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci@example.test
      ADMIN_PASSWORD: synthetic-CI-password-1234
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Dependências
        run: npm ci --include=dev
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v6
      - name: Dependências Python headless
        run: |
          uv sync --no-install-project
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Conferir runtime OCR headless
        run: |
          uv run --no-sync python -c "import cv2; from rapidocr import RapidOCR; print(cv2.__version__); RapidOCR()"
      - name: Versão e documentação
        run: npm run check:release
      - name: Tipos e build
        # The Python DRE fixtures use the real JS engine and its generated assets.
        run: npm run check && npm run build
      - name: Python, PDF e MongoDB descartável
        run: npm run test:reports
        env:
          REPORT_TEST_MONGO: '1'
          SIMPLES_TEST_OCR: '1'
      - name: Regras e HTTP
        run: npm test
      - name: Armazenamento sequencial em três MongoDB descartáveis
        run: npm run test:mongo-storage
      - name: Integração legada com MongoDB
        run: npm run test:integration
      - name: Consultas com API simulada e compartilhamento de registros
        run: npm run test:lookup-integration
      - name: Compras, vendas e isolamento com MongoDB descartável
        run: npm run test:purchases-integration
      - name: Gerações por empresa, retomada e isolamento
        run: npm run test:generations-integration
      - name: Simulações salvas, reprodução e isolamento
        run: npm run test:simulations-integration
      - name: Análises por setor, unicidade e histórico de versões
        run: npm run test:analyses-integration
      - name: Projeção anual e competências com MongoDB descartável
        run: npm run test:projection && npm run test:competences
      - name: Conta efêmera para teste
        run: npm run seed
      - name: Chromium para testes
        run: npx playwright install --with-deps chromium
      - name: Navegador, CSV e XLSX
        run: npm run test:e2e
      - name: Evidências de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maximum-verification
          path: |
            package-lock.json
            playwright-report/
            test-results/
          retention-days: 7
  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Origem de login e sessão pública (sem credenciais)
        run: node scripts/smoke-auth.mjs
      - name: Relatórios Python sem sessão permanecem privados
        run: node scripts/smoke-reports.mjs
      - name: Conectividade da fonte com um CNPJ público de exemplo
        continue-on-error: true
        run: node --experimental-strip-types scripts/verify-provider.mjs
