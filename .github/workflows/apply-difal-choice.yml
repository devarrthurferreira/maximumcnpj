name: Aplicar escolha DIFAL validada
on:
  push:
    branches: ['fix/difal-report-driven-choice-20261103']
    paths: ['.github/workflows/apply-difal-choice.yml', '.maintenance/difal-choice.part*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Conferir integridade e aplicar somente codigo
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/difal-report-driven-choice-20261103
          cat .maintenance/difal-choice.part1 .maintenance/difal-choice.part2 > /tmp/difal-choice.xz
          echo 'fbb566611c8f9a566c1389bf9729fb11254374739360f0d9e4fa63862ad56a37  /tmp/difal-choice.xz' | sha256sum -c -
          xz -dc /tmp/difal-choice.xz > /tmp/difal-choice.patch
          git apply --exclude='.github/workflows/*' --unidiff-zero --check /tmp/difal-choice.patch
          git apply --exclude='.github/workflows/*' --unidiff-zero --index /tmp/difal-choice.patch
          git rm .maintenance/difal-choice.part1 .maintenance/difal-choice.part2
          git diff --cached --check
      - name: Validar versao, tipos, build e regras
        run: |
          npm ci --include=dev
          npm run check:release
          npm run check
          npm run build
          npm test
      - name: Registrar apenas na branch solicitada
        run: |
          set -euo pipefail
          git fetch origin fix/difal-report-driven-choice-20261103
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: conferir relatorios antes da escolha DIFAL (v0.54.4)'
          git push origin HEAD:refs/heads/fix/difal-report-driven-choice-20261103
