name: Fonte isolada para ajuste da escolha DIFAL
on:
  push:
    branches: ['fix/difal-report-driven-choice-20261103']
    paths: ['.github/workflows/difal-source-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exportar somente codigo versionado
        run: git archive --format=tar -o /tmp/maximum-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: maximum-difal-source
          path: /tmp/maximum-source.tar
          retention-days: 1
