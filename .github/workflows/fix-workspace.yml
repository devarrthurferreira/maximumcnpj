name: Workspace descartável da correção DIFAL
on:
  push:
    branches: ['fix/sublimit-entry-difal-20261103']
    paths: ['.github/workflows/fix-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Ferramentas de teste isoladas, sem banco ou credenciais reais
        run: |
          mkdir -p test-runtime/bin test-runtime/python
          docker pull mongo:7.0
          id=$(docker create mongo:7.0)
          docker cp "$id:/usr/bin/mongod" test-runtime/bin/mongod
          docker rm "$id"
          python -m pip install --target test-runtime/python pymongo==4.18.2
          tar -czf test-runtime.tar.gz test-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: maximum-test-runtime
          path: test-runtime.tar.gz
          retention-days: 1
