name: Preparação única da identidade Maximum
on:
  push:
    branches: [prepare/maximum-brand-v0.5.1]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare/maximum-brand-v0.5.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Aplicar identidade e incorporar ativo oficial
        run: python scripts/prepare-maximum-brand.py
      - name: Registrar somente fontes e ativos, sem alterar produção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/identidade-maximum.md package.json src/domain.ts public reporting scripts/prepare-maximum-brand.py .github/workflows/prepare-maximum-brand.yml tests/branding_test.py tests/e2e/branding.spec.ts
          git commit -m 'style: aplica identidade Maximum v0.5.1 e incorpora logo oficial'
          git push origin HEAD:prepare/maximum-brand-v0.5.1
          git rev-parse HEAD
