name: Aplicar melhoria validada de interface
on:
  push:
    branches: ['feat/simple-flow-loading-20261103']
    paths: ['.github/workflows/apply-ui-feedback.yml', '.maintenance/ui-feedback.xz']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Conferir e aplicar patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/simple-flow-loading-20261103
          echo '805d1472a0b87101717235c4ba59b3ed3b2e08411a94e12f71c758ca2b5a2d5d  .maintenance/ui-feedback.xz' | sha256sum -c -
          xz -dc .maintenance/ui-feedback.xz > /tmp/ui-feedback.patch
          git apply --unidiff-zero --check /tmp/ui-feedback.patch
          git apply --unidiff-zero --index /tmp/ui-feedback.patch
          git diff --cached --check
      - name: Validar aplicação
        run: |
          npm ci --include=dev
          npm run check:release
          npm run check
          npm run build
          npm test
      - name: Registrar somente nesta branch
        run: |
          set -euo pipefail
          git fetch origin feat/simple-flow-loading-20261103
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: simplificar DIFAL e exibir carregamento por operação (v0.54.5)'
          git push origin HEAD:refs/heads/feat/simple-flow-loading-20261103
