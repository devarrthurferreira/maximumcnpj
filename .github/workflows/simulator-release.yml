name: Projeção anual do simulador
on:
  push:
    branches: ['feat/simulador-anual-20261001']
permissions:
  contents: read
jobs:
  annual-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: maximum_projection_ci
      WORKSPACE_ID: projection_ci
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run check:release && npm run check && npm run build
      - run: npm run test:projection && npm run test:competences
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/simulator-projection.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-annual-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
