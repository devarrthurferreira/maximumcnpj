[project]
name = "maximum-cnpj-python"
version = "0.12.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reportlab==4.4.9",
  "pymongo==4.18.2",
  "pymupdf==1.28.2",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "opencv-python-headless==5.0.0.93",
]

# RapidOCR declares desktop OpenCV as a hard dependency. In Vercel's headless
# Python runtime that wheel fails at import time because X11/libxcb is absent.
# uv supports scoped exclusions, so replace only RapidOCR's desktop dependency
# while keeping every other declared dependency intact.
[tool.uv]
exclude-dependencies = ["opencv-python"]
