[project]
name = "maximum-cnpj-python"
version = "0.19.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reportlab==4.4.9",
  "pymongo==4.18.2",
  "pymupdf==1.28.2",
  "requests==2.34.2",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "opencv-python-headless==5.0.0.93",
]

# RapidOCR declares desktop OpenCV as a hard dependency. In Vercel's headless
# Python runtime that wheel fails at import time because X11/libxcb is absent.
# Vercel resolves this project with uv. Exclude RapidOCR's desktop OpenCV transitive
# dependency and install opencv-python-headless explicitly, avoiding X11/libxcb.
[tool.uv]
exclude-dependencies = ["opencv-python"]
